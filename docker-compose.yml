services:
  angie:
    image: docker.angie.software/angie:1.9.1
    container_name: angie
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./angie.conf:/etc/angie/angie.conf
      - ./options-ssl-angie.conf:/etc/angie/options-ssl-angie.conf
      - ./acme/:/var/lib/angie/acme/
    networks:
      - 3x-ui-aio-network
    restart: unless-stopped

  3x-ui:
    image: ghcr.io/mhsanaei/3x-ui:2.9.4
    container_name: 3x-ui
    volumes:
      - ./db/:/etc/x-ui/
      - 3x-ui-aio-volume:/app/bin/
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      X_UI_ENABLE_FAIL2BAN: "false"
    tty: true
    networks:
      - 3x-ui-aio-network
    restart: unless-stopped

  authorization-stub:
    image: ampetelin/authorization-stub:latest
    container_name: authorization-stub
    command: waitress-serve --listen=*:5000 app:app
    networks:
      - 3x-ui-aio-network
    restart: unless-stopped

networks:
  3x-ui-aio-network:
    name: 3x-ui-aio-network
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.25.0.0/24
        - subnet: fd00:172:25::/64

volumes:
  3x-ui-aio-volume:
    name: 3x-ui-aio-volume
